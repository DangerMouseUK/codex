name: fork-ci

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full native Rust workspace and SDK suites
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    if: github.repository != 'openai/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust_full: ${{ steps.coverage.outputs.rust_full }}
      sdk: ${{ steps.coverage.outputs.sdk }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select coverage
        id: coverage
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full || false }}
        run: |
          set -euo pipefail
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            args=(--base HEAD --head HEAD)
          fi
          if [[ "$FULL" == true ]]; then
            args+=(--full)
          fi
          python3 .github/scripts/fork_ci_changes.py "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  blob-size-policy:
    if: github.repository != 'openai/codex'
    uses: ./.github/workflows/blob-size-policy.yml

  cargo-deny:
    if: github.repository != 'openai/codex'
    uses: ./.github/workflows/cargo-deny.yml

  codespell:
    if: github.repository != 'openai/codex'
    uses: ./.github/workflows/codespell.yml

  repo-checks:
    if: github.repository != 'openai/codex'
    uses: ./.github/workflows/repo-checks.yml

  rust-quality:
    if: github.repository != 'openai/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-shear@1.11.2
      - name: Check Rust formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      # Unlinked source warnings are informational; unused dependencies still fail.
      - name: Check for unused dependencies
        run: cargo shear
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  native-rust:
    name: Native Rust (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: pwsh
        working-directory: codex-rs
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_FULL: ${{ needs.changes.outputs.rust_full }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare full workspace runtime tools
        if: needs.changes.outputs.rust_full == 'true'
        uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest@0.9.103
      - name: Cache Cargo downloads and native build outputs
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ env.CARGO_TARGET_DIR }}
          key: fork-cargo-${{ runner.os }}-${{ runner.arch }}-${{ needs.changes.outputs.rust_full }}-${{ hashFiles('codex-rs/rust-toolchain.toml', 'codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            fork-cargo-${{ runner.os }}-${{ runner.arch }}-${{ needs.changes.outputs.rust_full }}-${{ hashFiles('codex-rs/rust-toolchain.toml', 'codex-rs/Cargo.lock') }}-
            fork-cargo-${{ runner.os }}-${{ runner.arch }}-${{ needs.changes.outputs.rust_full }}-
      - name: Lint and test native Rust
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUST_FULL -eq 'true') {
            $scope = @('--workspace')
            cargo build --locked --workspace --bins --timings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $scope = @('-p', 'codex-shell-command', '-p', 'codex-utils-pty', '-p', 'codex-utils-path')
          }
          Write-Host "Cargo scope: $scope"
          cargo clippy --locked @scope --all-targets --timings -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked @scope --no-fail-fast --timings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test results and Cargo timings
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fork-native-${{ matrix.os }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/nextest/default/junit.xml
            ${{ env.CARGO_TARGET_DIR }}/cargo-timings/*.html
          if-no-files-found: ignore
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    uses: ./.github/workflows/sdk.yml

  required:
    name: Fork CI required
    if: always() && github.repository != 'openai/codex'
    needs:
      [
        changes,
        blob-size-policy,
        cargo-deny,
        codespell,
        repo-checks,
        rust-quality,
        native-rust,
        sdk,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require successful checks
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          SDK_REQUIRED: ${{ needs.changes.outputs.sdk }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$SDK_REQUIRED" == false ]]; then
            args+=(--allow-skipped sdk)
          fi
          python3 .github/scripts/check_ci_results.py "${args[@]}"
