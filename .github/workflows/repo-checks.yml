name: repo-checks

on:
  workflow_call:

jobs:
  windows-setup:
    name: Windows setup (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download Pester for this runner
        shell: pwsh
        run: Save-Module -Name Pester -RequiredVersion 5.7.1 -Repository PSGallery -Path "$env:RUNNER_TEMP/windows-setup-tests" -Force

      - name: Verify repository policies on Windows
        run: |
          foreach ($script in @('verify_cargo_workspace_manifests.py', 'verify_tui_core_boundary.py', 'verify_bazel_clippy_lints.py')) {
            python ".github/scripts/$script"
            if ($LASTEXITCODE -ne 0) { throw "Repository policy failed: $script" }
          }

      - name: Test Windows setup with mocked installers
        run: |
          Import-Module "$env:RUNNER_TEMP/windows-setup-tests/Pester/5.7.1/Pester.psd1" -Force
          $result = Invoke-Pester -Path ./codex-rs/scripts/setup-windows.Tests.ps1 -PassThru -Output Normal
          if ($result.FailedCount -ne 0 -or $result.PassedCount -eq 0) { throw 'Windows setup tests failed or did not run.' }

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Test fork coverage selection and CI result policy
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_fork_ci_changes.py'
          python3 -m unittest discover -s .github/scripts -p 'test_check_ci_results.py'

      - name: Validate hosted fork workflow configuration
        if: github.repository != 'openai/codex'
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -shellcheck= -pyflakes=
          .github/workflows/fork-ci.yml .github/workflows/blocking-ci.yml
          .github/workflows/postmerge-ci.yml .github/workflows/repo-checks.yml
          .github/workflows/sdk.yml

      - name: Verify codex-rs Cargo manifests inherit workspace settings
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Verify codex-tui does not import codex-core directly
        run: python3 .github/scripts/verify_tui_core_boundary.py

      - name: Verify Bazel clippy flags match Cargo workspace lints
        run: python3 .github/scripts/verify_bazel_clippy_lints.py

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - name: Test downstream Python release resolution
        run: python3 -m unittest discover -s .github/scripts -p 'test_resolve_python_cli_release.py'

      - name: Test release version comparison
        run: python3 -m unittest discover -s .github/scripts -p 'test_releases.py'

      - name: Test PyPI release verification
        run: uv run --no-project --with packaging==26.2 python -m unittest discover -s .github/scripts -p 'test_verify_pypi_release.py'

      - name: Test Codex package builder
        run: python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'

      - name: Test standalone installer
        run: python3 -m unittest discover -s scripts/install -p 'test_*.py'

      - name: Test macOS signing and notarization
        run: python3 -m unittest discover -s .github/scripts/macos-signing -p 'test_*.py'

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - name: Check formatting (run `just fmt` to fix)
        run: |
          if ! just fmt-check; then
            uv run --frozen --project scripts ruff format --diff . || true
            uv run --frozen --project sdk/python --only-group format ruff format --diff sdk/python || true
            exit 1
          fi

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
